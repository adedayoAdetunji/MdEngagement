</main>
        <script>
            const notice = document.querySelector('#notice');
            const report = (message, error = false) => {
                notice.textContent = message;
                notice.dataset.error = error;
            };

            async function api(path, method = 'GET', body) {
                const response = await fetch(BASE.replace(/\/$/, '') + '/engagement/' + path, {
                    method,
                    credentials: 'same-origin',
                    headers: {'Authorization': `Bearer ${LWTOKEN}`,'Accept': 'application/json', 'Content-Type': 'application/json'},
                    body: body ? JSON.stringify(body) : undefined
                });
                const result = await response.json().catch(() => null);
                if (!response.ok || String(result?.responseCategory) !== '200') {
                    throw new Error(result?.responseResult || 'Could not load data. Check session and permissions.');
                }
                return result;
            }

            const filter = document.querySelector('#filter');
            const list = document.querySelector('#records');
            const previous = document.querySelector('#previous');
            const next = document.querySelector('#next');
            let page = 1;
            let loading = false;

            function add(parent, tag, value) {
                const node = document.createElement(tag);
                node.textContent = value;
                parent.append(node);
                return node;
            }

            async function load() {
                if (loading) return;
                loading = true;
                filter.disabled = previous.disabled = next.disabled = true;
                list.replaceChildren();
                report('Loading enquiries…');

                try {
                    const { responseData } = await api('admin/enquiries?' + new URLSearchParams({ page, status: filter.value }));
                    const items = responseData?.items || [];

                    for (const row of items) {
                        const card = add(list, 'article', '');
                        card.className = 'record';
                        add(card, 'h2', row.subject);
                        add(card, 'p', `${row.full_name} · ${row.email} · ${row.created_at}`);
                        add(card, 'p', row.message);

                        const label = add(card, 'label', 'Status');
                        const select = add(label, 'select', '');
                        for (const s of ['new', 'read', 'resolved']) {
                            add(select, 'option', s).value = s;
                        }
                        select.value = row.status;

                        select.addEventListener('change', async () => {
                            select.disabled = true;
                            try {
                                await api('admin/enquiries/status', 'PATCH', { ltId: row.lt_id, status: select.value });
                                row.status = select.value;
                                if (filter.value && filter.value !== row.status) {
                                    card.remove();
                                }
                                report('Status saved.');
                            } catch (error) {
                                select.value = row.status;
                                report(error.message, true);
                            } finally {
                                select.disabled = false;
                            }
                        });
                    }

                    next.disabled = !responseData?.hasMore;
                    report(items.length ? `Page ${page}` : 'No enquiries found.');
                } catch (error) {
                    report(error.message, true);
                } finally {
                    loading = filter.disabled = false;
                    previous.disabled = page === 1;
                }
            }

            filter.addEventListener('change', () => { page = 1; load(); });
            previous.addEventListener('click', () => { page--; load(); });
            next.addEventListener('click', () => { page++; load(); });

            load();
        </script>
