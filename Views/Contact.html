        <?php ltImport('MdEngagement','Script.js') ?>
        <script>

            const notice = document.querySelector('#notice');
            const report = (message, error = false) => {
                notice.textContent = message;
                notice.dataset.error = error;
            };

            async function api(path, method = 'GET', body) {
                const response = await fetch(BASE_ENGAGE.replace(/\/$/, '') + '/engagement/' + path, {
                    method,
                    credentials: 'same-origin',
                    headers: body ? {'Accept': 'application/json', 'Content-Type': 'application/json'} : {'Accept': 'application/json'},
                    body: body ? JSON.stringify(body) : undefined
                });
                const result = await response.json().catch(() => null);
                if (!response.ok || String(result?.responseCategory) !== '200') {
                    throw new Error(result?.responseResult || 'Could not reach the module. Check the API address.');
                }
                return result;
            }

            const form = document.querySelector('form');
            form.addEventListener('submit', async event => {
                event.preventDefault();
                const button = form.querySelector('button');
                button.disabled = true;
                report('Sending…');
                const data = Object.fromEntries(new FormData(form));
                try {
                    const result = await api('enquiries', 'POST', data);
                    form.reset();
                    report(result.responseResult || 'Message received.');
                } catch (error) {
                    report(error.message, true);
                } finally {
                    button.disabled = false;
                }
            });
        </script>
    </body>
</html>
