<?php ltImport('MdEngagement','Script.js') ?>
        <script>
            
            
            const notice = document.querySelector('#notice');
            const report = (message, error = false) => {
                notice.textContent = message;
                notice.dataset.error = error;
            };

            async function api(path, method = 'GET', body) {
                const response = await fetch(BASE_ENGAGE.replace(/\/$/, '') + '/engagement/' + path, {
                    method,
                    credentials: 'same-origin',
                    headers: {'Authorization': `Bearer ${LW_TOKEN_ENGAGE}`,'Accept': 'application/json', 'Content-Type': 'application/json'},
                    body: body ? JSON.stringify(body) : undefined
                });
                const result = await response.json().catch(() => null);
                if (!response.ok || String(result?.responseCategory) !== '200') {
                    throw new Error(result?.responseResult || 'Could not load subscribers. Check session and permissions.');
                }
                return result;
            }

            const filter = document.querySelector('#filter');
            const list = document.querySelector('#records');
            const previous = document.querySelector('#previous');
            const next = document.querySelector('#next');
            let page = 1;
            let loading = false;

            function add(parent, tag, value) {
                const node = document.createElement(tag);
                node.textContent = value;
                parent.append(node);
                return node;
            }

            async function load() {
                if (loading) return;
                loading = true;
                filter.disabled = previous.disabled = next.disabled = true;
                list.replaceChildren();
                report('Loading subscribers…');

                try {
                    const { responseData } = await api('admin/subscribers?' + new URLSearchParams({ page, status: filter.value }));
                    const items = responseData?.items || [];

                    for (const row of items) {
                        const card = add(list, 'article', '');
                        card.className = 'record';
                        add(card, 'h2', row.email);
                        const statusLabel = row.unsubscribed_at ? 'Unsubscribed' : 'Active';
                        const joinedDate = row.consented_at || row.created_at || '';
                        add(card, 'p', `${statusLabel} · Joined ${joinedDate}`);
                    }

                    next.disabled = !responseData?.hasMore;
                    report(items.length ? `Page ${page}` : 'No subscribers found.');
                } catch (error) {
                    report(error.message, true);
                } finally {
                    loading = filter.disabled = false;
                    previous.disabled = page === 1;
                }
            }

            filter.addEventListener('change', () => { page = 1; load(); });
            previous.addEventListener('click', () => { page--; load(); });
            next.addEventListener('click', () => { page++; load(); });

            load();
        </script>
    </body>
</html>
