    <body data-mode="unsubscribe">
        <main>
            <div class="hero">
                <p class="eyebrow">Engagement center</p>
                <h1>Manage your subscription</h1>
                <p class="muted">Confirm below to stop receiving newsletter emails.</p>
            </div>
            <div class="grid">
                <section class="card">
                    <form>
                        <button>Confirm unsubscribe</button>
                    </form>
                    <p id="notice" role="status">
                    </p>
                </section>
                <aside class="card aside">
                    <h2>Changed your mind?</h2>
                    <p class="muted">You can leave this page without making changes.</p>
                </aside>
            </div>
            <footer>Engagement center</footer>
        </main>
        <?php ltImport('MdEngagement','Script.js') ?>
        <script>

            const notice = document.querySelector('#notice');
            const report = (message, error = false) => {
                notice.textContent = message;
                notice.dataset.error = error;
            };

            const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
            const form = document.querySelector('form');
            const button = form.querySelector('button');

            if (!token) {
                button.disabled = true;
                report('Open the unsubscribe link provided in your email or signup confirmation.', true);
            }

            async function api(path, method = 'GET', body) {
                const response = await fetch(BASE_ENGAGE.replace(/\/$/, '') + '/engagement/' + path, {
                    method,
                    credentials: 'same-origin',
                    headers: body ? {'Accept': 'application/json', 'Content-Type': 'application/json'} : {'Accept': 'application/json'},
                    body: body ? JSON.stringify(body) : undefined
                });
                const result = await response.json().catch(() => null);
                if (!response.ok || String(result?.responseCategory) !== '200') {
                    throw new Error(result?.responseResult || 'Could not reach the module. Check the API address.');
                }
                return result;
            }

            form.addEventListener('submit', async event => {
                event.preventDefault();
                if (!token) return;
                button.disabled = true;
                report('Unsubscribing…');
                try {
                    const result = await api('unsubscribe', 'POST', { token });
                    report(result.responseResult || 'You are unsubscribed.');
                } catch (error) {
                    report(error.message, true);
                    button.disabled = false;
                }
            });
        </script>
    </body>
</html>
